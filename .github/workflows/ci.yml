name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite (unit + integration + security + RBAC + tenant isolation)
        run: python -m pytest tests/ -v
      - name: Verify Alembic migrations apply cleanly
        run: |
          rm -f ./ci_migration_check.db
          DATABASE_URL="sqlite+aiosqlite:///./ci_migration_check.db" python -m alembic upgrade head

  backend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt || true # non-blocking until triaged; see PRODUCTION_READINESS.md

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
