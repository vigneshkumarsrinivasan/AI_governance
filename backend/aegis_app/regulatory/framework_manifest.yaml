# =============================================================================
# CANONICAL REGULATORY SOURCE & LICENCE MANIFEST
# =============================================================================
# This file is the single source of truth for WHERE authoritative regulatory
# content comes from and WHETHER the platform is legally permitted to reproduce
# it. The ingestion pipeline (aegis_app/regulatory/pipeline.py) reconciles the
# database against this file on every run.
#
# licence_status vocabulary (spec section 3):
#   VERIFIED_REUSABLE            - open licence / public-domain, full text may be shown
#   VERIFIED_WITH_ATTRIBUTION    - reuse allowed if source is acknowledged
#   VERIFIED_SHARE_ALIKE         - reuse allowed, derivatives must use same licence
#   SOURCE_ONLY_NO_REDISTRIBUTION- may parse for internal structure, MUST NOT show full text
#   CUSTOMER_LICENCE_REQUIRED    - customer must supply their own licensed copy
#   UNKNOWN                      - not yet reviewed; store legally-safe metadata only
#
# ingestion_status vocabulary:
#   READY_MACHINE_READABLE  - official structured source exists and a parser is implemented
#   READY_FIXTURE           - committed offline fixture available, parser implemented
#   SOURCE_RETRIEVAL_BLOCKED- no reusable structured source yet / licence blocks reproduction
#   METADATA_ONLY           - only reference metadata stored, no provisions reproduced
# =============================================================================

manifest_version: "1.0.0"
generated_note: >
  Licence determinations recorded here are engineering best-effort based on the
  publishers' stated terms and must be confirmed by qualified counsel before a
  framework is marked PRODUCTION_READY (spec section 3, section 41).

